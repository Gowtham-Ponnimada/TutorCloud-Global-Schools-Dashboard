VALUE_NORMALIZATION:
  trim_whitespace: true
  empty_string_to_null: true
  numeric_commas_remove: true
  percent_fields_store_as_numeric_pct: true
  offered_boolean_map:
    "1": true
    "0": false
    "Y": true
    "N": false
    "Yes": true
    "No": false

