DATA_QUALITY_RULES:
  canonical_school_grain: Use rolled school reporting school-year grain.
  location_row_choice: Prefer Single Entity, then Head Campus, then Sub-Campus when deduplicating rolled locations.
  grade_suppression_rule: If school total enrolments < 5, grade-level values may be suppressed and should remain null.
  profile_vs_abs_note: ACARA profile totals may differ from ABS/NSSC due to scope differences; do not force-fit row-level data.
