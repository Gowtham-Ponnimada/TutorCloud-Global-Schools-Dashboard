COUNTRY_NAME: Australia
SCHOOL_YEAR: "2025"
SOURCE_SYSTEM: ACARA_2025
PRIMARY_BENCHMARK_SYSTEM: ABS_2025
CANONICAL_SCHOOL_ID_RULE: "COALESCE(rolled_school_id, acara_sml_id, school_age_id)"
CANONICAL_DISTRICT_RULE: "state_abbr || ':' || COALESCE(NULLIF(lga_code,''), md5(state_abbr || '|' || COALESCE(lga_name,'Unknown LGA')))"
CANONICAL_DISTRICT_NAME_RULE: "COALESCE(NULLIF(lga_name,''), 'Unknown LGA')"

